<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFinance Hub - Add Budget Category</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="add-budget">
    <div class="site-wrapper center-content">
        <section class="card form-container-card">
            <div class="form-card-header">
                <h2 class="card-title">Add Budget Category</h2>
                <a href="wf19_wallet_overview.html" class="close-x-btn" aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></a>
            </div>
            <p class="form-subtext">Create a new spending category for your monthly budget.</p>

            <form id="categoryLimitForm" action="wf19_wallet_overview.html" method="GET" novalidate>
                <div class="form-group">
                    <label for="catNameInput">Category Name<span class="required-asterisk">*</span></label>
                    <input type="text" id="catNameInput" name="categoryName" class="form-input" placeholder="e.g Accommodation" required>
                </div>

                <div class="form-group">
                    <label for="catLimitInput">Amount (R)<span class="required-asterisk">*</span></label>
                    <input type="number" step="0.01" id="catLimitInput" name="limit" class="form-input" placeholder="0.00" min="1.00" required>
                </div>

                <div class="modal-buttons-row">
                    <a href="wf19_wallet_overview.html" class="btn-outline flex-btn text-center">Cancel</a>
                    <button type="submit" class="btn-primary flex-btn">Add Category</button>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
