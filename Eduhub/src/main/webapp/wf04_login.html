<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFinance Hub - Secure Access</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="login">
    <div class="site-wrapper">
        <div id="stickyTopAlert" class="sticky-error-alert" role="alert">
            <div class="error-msg-text"></div>
            <button id="dismissTopAlertBtn" class="dismiss-btn" aria-label="Dismiss"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>

        <header class="app-header">
            <a href="wf02_discovery_entry.html" class="nav-icon-btn back-btn" aria-label="Go Back">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </a>
            <h1 class="brand-title header-center-title">Secure Access</h1>
            <a href="wf15_sidebar.html" class="nav-icon-btn" aria-label="Open Navigation">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg>
            </a>
        </header>

        <main class="main-viewport-content center-content">
            <section class="card form-container-card login-card-box">
                <div class="form-card-header text-right">
                    <a href="wf02_discovery_entry.html" class="close-x-btn" aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></a>
                </div>
                <h2 class="card-title text-center">Welcome Back</h2>
                <p class="form-subtext text-center">Log in to access your funding dashboard</p>

                <form id="loginAccessForm" novalidate>
                    <div class="form-group">
                        <label for="logEmail">Email Address<span class="required-asterisk">*</span></label>
                        <input type="email" id="logEmail" name="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="logPassword">Password<span class="required-asterisk">*</span></label>
                        <input type="password" id="logPassword" name="password" class="form-input" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="btn-primary full-width-btn">Login</button>

                    <div class="auth-redirect-sub text-center">
                        Don't have an account? <a href="wf03_register.html" class="inline-link">Sign Up</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
