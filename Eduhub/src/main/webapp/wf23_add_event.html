<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFinance Hub - Add New Event</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="add-event">
    <div class="site-wrapper center-content">
        <section class="card form-container-card">
            <div class="form-card-header">
                <h2 class="card-title">Add New Event</h2>
                <a href="wf22_calendar_main.html" class="close-x-btn" aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></a>
            </div>
            <p class="form-subtext">Schedule a new event, deadline, or reminder.</p>

            <form id="calendarEventForm" action="wf22_calendar_main.html" method="GET" novalidate>
                <div class="form-group">
                    <label for="eventTitleInput">Event Title<span class="required-asterisk">*</span></label>
                    <input type="text" id="eventTitleInput" name="title" class="form-input" placeholder="e.g.. Bursary Application Deadline" required>
                </div>
                <div class="form-group">
                    <label for="eventDateInput">Date<span class="required-asterisk">*</span></label>
                    <input type="date" id="eventDateInput" name="date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="eventTypeInput">Event Type <span class="optional-badge">(OPTIONAL)</span></label>
                    <input type="text" id="eventTypeInput" name="type" data-optional="true" class="form-input" placeholder="e.g..Deadline">
                </div>
                <div class="form-group">
                    <label for="eventDescInput">Description <span class="optional-badge">(OPTIONAL)</span></label>
                    <textarea id="eventDescInput" name="description" data-optional="true" class="form-input form-textarea" placeholder="Add schedule details"></textarea>
                </div>
                <div class="modal-buttons-row">
                    <a href="wf22_calendar_main.html" class="btn-outline flex-btn text-center">Cancel</a>
                    <button type="submit" class="btn-primary flex-btn">Add Event +</button>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
