<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFinance Hub - Step 2: Academic</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="step2">
    <div class="site-wrapper">
        <div id="stickyTopAlert" class="sticky-error-alert" role="alert">
            <div class="error-msg-text"></div>
            <button id="dismissTopAlertBtn" class="dismiss-btn" aria-label="Dismiss"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>

        <header class="app-header">
            <a href="wf06_step1_identity.html" class="nav-icon-btn back-btn" aria-label="Back">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </a>
            <div class="brand-title header-center-title">Step 2 · Academic</div>
            <a href="wf15_sidebar.html" class="nav-icon-btn" aria-label="Menu">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg>
            </a>
        </header>

        <main class="main-viewport-content center-content">
            <section class="quest-stage-wrapper">
                <p class="step-subtitle">Where are you in your journey?</p>
                <div class="progress-bar-container">
                    <div class="prog-segment active"></div>
                    <div class="prog-segment active"></div>
                    <div class="prog-segment"></div>
                    <div class="prog-segment"></div>
                    <div class="prog-segment"></div>
                </div>

                <form id="step2AcademicForm" action="wf08_step3_dna.html" method="GET" novalidate>
                    <div class="form-group">
                        <label class="group-label">CURRENT GRADE / YEAR<span class="required-asterisk">*</span></label>
                        <input type="hidden" id="selectedGradeInput" name="academicLevel" value="" required>
                        <div class="chip-grid" id="gradeChipsGrid">
                            <button type="button" class="chip" data-val="Grade 11">Grade 11</button>
                            <button type="button" class="chip" data-val="Grade 12">Grade 12</button>
                            <button type="button" class="chip" data-val="1st Year">1st Year</button>
                            <button type="button" class="chip" data-val="2nd Year">2nd Year</button>
                            <button type="button" class="chip" data-val="3rd Year +">3rd Year +</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="group-label">FIELD OF STUDY<span class="required-asterisk">*</span></label>
                        <input type="hidden" id="selectedFieldInput" name="fieldOfStudy" value="" required>
                        <div class="chip-grid" id="fieldChipsGrid">
                            <button type="button" class="chip" data-val="Science">Science</button>
                            <button type="button" class="chip" data-val="Art">Art</button>
                            <button type="button" class="chip" data-val="Law">Law</button>
                            <button type="button" class="chip" data-val="IT">IT</button>
                            <button type="button" class="chip" data-val="Business">Business</button>
                            <button type="button" class="chip" data-val="Engineering">Engineering</button>
                            <button type="button" class="chip" data-val="Commerce">Commerce</button>
                            <button type="button" class="chip" data-val="Education">Education</button>
                            <button type="button" class="chip" data-val="Humanities">Humanities</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="step2Institution">INSTITUTION (OPTIONAL)</label>
                        <input type="text" id="step2Institution" name="institution" class="form-input" data-optional="true" placeholder="e.g...Cape Peninsula University of Technology">
                    </div>

                    <button type="submit" class="btn-primary full-width-btn">Continue Step 3 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
