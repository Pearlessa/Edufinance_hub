<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFinance Hub - Step 1: Identity</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="step1">
    <div class="site-wrapper">
        <div id="stickyTopAlert" class="sticky-error-alert" role="alert">
            <div class="error-msg-text"></div>
            <button id="dismissTopAlertBtn" class="dismiss-btn" aria-label="Dismiss"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>

        <header class="app-header">
            <a href="wf05_bursary_quest.html" class="nav-icon-btn back-btn" aria-label="Back">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
            </a>
            <div class="brand-title header-center-title">Step 1 : Identity</div>
            <a href="wf15_sidebar.html" class="nav-icon-btn" aria-label="Menu">
                <svg viewBox="0 0 24 24" class="svg-icon"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/></svg>
            </a>
        </header>

        <main class="main-viewport-content center-content">
            <section class="quest-stage-wrapper">
                <p class="step-subtitle">Tell us who you are</p>
                <div class="progress-bar-container">
                    <div class="prog-segment active"></div>
                    <div class="prog-segment"></div>
                    <div class="prog-segment"></div>
                    <div class="prog-segment"></div>
                    <div class="prog-segment"></div>
                </div>

                <form id="step1IdentityForm" action="wf07_step2_academic.html" method="GET" novalidate>
                    <div class="form-group">
                        <label for="step1FullName">Full Name<span class="required-asterisk">*</span></label>
                        <input type="text" id="step1FullName" name="fullName" class="form-input" placeholder="E.g Dave Fish" required>
                    </div>

                    <div class="form-group">
                        <label for="step1Age">Age<span class="required-asterisk">*</span></label>
                        <input type="number" id="step1Age" name="age" class="form-input" placeholder="e.g...19" min="14" max="35" required>
                    </div>

                    <div class="form-group">
                        <label class="group-label">Select Province<span class="required-asterisk">*</span></label>
                        <input type="hidden" id="selectedProvinceInput" name="province" value="" required>
                        <div class="chip-grid" id="provinceChipsGrid">
                            <button type="button" class="chip" data-val="Gauteng">Gauteng</button>
                            <button type="button" class="chip" data-val="KZN">KZN</button>
                            <button type="button" class="chip" data-val="Limpopo">Limpopo</button>
                            <button type="button" class="chip" data-val="Free State">Free State</button>
                            <button type="button" class="chip" data-val="Western Cape">Western Cape</button>
                            <button type="button" class="chip" data-val="Cape Town">Cape Town</button>
                            <button type="button" class="chip" data-val="Northern Cape">Northern Cape</button>
                            <button type="button" class="chip" data-val="Eastern Cape">Eastern Cape</button>
                            <button type="button" class="chip" data-val="Mpumalanga">Mpumalanga</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary full-width-btn">Continue Step 2 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
