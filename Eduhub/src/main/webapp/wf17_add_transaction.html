<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFinance Hub - Add New Transaction</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body data-page="add-transaction">
    <div class="site-wrapper center-content">
        <section class="card form-container-card">
            <div class="form-card-header">
                <h2 class="card-title">Add New Transaction</h2>
                <a href="wf19_wallet_overview.html" class="close-x-btn" aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></a>
            </div>
            <p class="form-subtext">Record your income or expense to track your finances.</p>

            <form id="transactionEntryForm" novalidate>
                <div class="segmented-choice-row">
                    <button type="button" id="toggleExpenseBtn" class="choice-pill active"><i class="fa-solid fa-arrow-trend-up" aria-hidden="true"></i> Expenses</button>
                    <button type="button" id="toggleIncomeBtn" class="choice-pill"><i class="fa-solid fa-arrow-trend-down" aria-hidden="true"></i> Income</button>
                </div>
                <input type="hidden" id="txTypeInput" name="type" value="Expense">

                <div class="form-group">
                    <label for="txDescInput">Description<span class="required-asterisk">*</span></label>
                    <input type="text" id="txDescInput" name="description" class="form-input" placeholder="e.g  Groceries at checkers" required>
                </div>

                <div class="form-group">
                    <label for="txCategoryInput">Category<span class="required-asterisk">*</span></label>
                    <select id="txCategoryInput" name="category" class="form-input" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Accommodation">Accommodation</option>
                        <option value="Data & Airtime">Data &amp; Airtime</option>
                        <option value="Study Materials">Study Materials</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Income">Income</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="txAmountInput">Amount (R)<span class="required-asterisk">*</span></label>
                    <input type="number" step="0.01" id="txAmountInput" name="amount" class="form-input" placeholder="0.00" min="0.01" required>
                </div>

                <div class="modal-buttons-row">
                    <a href="wf19_wallet_overview.html" class="btn-outline flex-btn text-center">Cancel</a>
                    <button type="submit" class="btn-primary flex-btn">Add Transaction</button>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
